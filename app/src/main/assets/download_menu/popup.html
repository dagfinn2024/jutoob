<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2Mate Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <main>
      <div id="downloadSection" class="download-section hidden">
        <iframe
          id="downloadIframe"
          src=""
          title="Download"
          scrolling="yes"
        ></iframe>
      </div>
           <!-- Input Section -->
      <div class="input-section">
        <input
          type="text"
          id="urlInput"
          placeholder="Paste YouTube URL here..."
          autocomplete="off"
          hidden="true"
        >
      </div>

      <button id="currentTabBtn" class="btn-secondary" hidden="true">
        Use Current Tab URL
      </button>

      <!-- Error Message -->
      <div id="error" class="error hidden"></div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
